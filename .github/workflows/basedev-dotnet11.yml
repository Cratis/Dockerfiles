name: Base Development Images for .NET 11

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
  pull_request:
    types: [closed]
    branches:
      - "main"
    paths:
      - "BaseDevelopmentDotNet11/**"
      - ".github/workflows/basedev-dotnet11.yml"

permissions: {}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release
        id: release
        uses: cratis/release-action@fefcf36b86e78ff5d4d116da7f472bacf2d3d3c1 # v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-docker:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build .NET 11 Base Development Image
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2.10.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./BaseDevelopmentDotNet11/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            cratis/base:${{ needs.release.outputs.version }}-dotnet11
            cratis/base:dotnet11
          build-args: |
            VERSION=${{ needs.release.outputs.version }}

      # Publish the base first, then consume that exact version on both platforms.
      - name: Build .NET 11 Base Development Image with MongoDB
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2.10.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./BaseDevelopmentDotNet11/MongoDB/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            cratis/base-mongodb:${{ needs.release.outputs.version }}-dotnet11
            cratis/base-mongodb:dotnet11
          build-args: |
            BASE_IMAGE=cratis/base:${{ needs.release.outputs.version }}-dotnet11
            VERSION=${{ needs.release.outputs.version }}
